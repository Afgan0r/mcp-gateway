name: Gateway image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Publication is serialized across push and manual runs. A newer main revision
# cancels the older run; a final remote-head check also rejects stale dispatches.
concurrency:
  group: gateway-image-main
  cancel-in-progress: true

env:
  GATEWAY_IMAGE: ghcr.io/afgan0r/mcp-gateway

jobs:
  quality:
    if: github.repository == 'Afgan0r/mcp-gateway' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.12.4 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Validate documentation
        run: pnpm docs:validate
      - name: Check frontend types
        run: pnpm frontend:typecheck
      - name: Build full distribution
        run: pnpm build
      - name: Verify distribution
        run: node scripts/verify-dist.js
      - name: Prepare real Docker lifecycle fixture
        run: docker info --format '{{.ServerVersion}}' && docker pull node:22
      - name: Run full test suite
        run: pnpm test:ci

  publish:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - uses: docker/setup-buildx-action@v3
      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gateway
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.GATEWAY_IMAGE }}:sha-${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
      - name: Smoke-test the production image
        run: node scripts/verify-gateway-image.mjs "$GATEWAY_IMAGE:sha-$GITHUB_SHA"
      - name: Require current main revision
        run: |
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$remote_sha" = "$GITHUB_SHA"
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        run: |
          docker push "$GATEWAY_IMAGE:sha-$GITHUB_SHA"
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$remote_sha" = "$GITHUB_SHA"
          docker tag "$GATEWAY_IMAGE:sha-$GITHUB_SHA" "$GATEWAY_IMAGE:latest"
          docker push "$GATEWAY_IMAGE:latest"
