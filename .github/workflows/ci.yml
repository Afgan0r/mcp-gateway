name: CI/CD Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Enable Corepack
        run: corepack enable && corepack install && pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate docs (MDX)
        run: pnpm docs:validate

      - name: Run linter
        run: pnpm lint

      - name: Run frontend type checking
        run: pnpm frontend:typecheck

      - name: Build full distribution
        run: pnpm build

      - name: Verify distribution
        run: node scripts/verify-dist.js

      - name: Prepare real Docker lifecycle fixture
        run: docker info --format '{{.ServerVersion}}' && docker pull node:24.16.0-bookworm-slim

      - name: Run tests
        run: pnpm test:ci

